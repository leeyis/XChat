name: Android APK

# 手动触发，或打 tag 时构建。
# 不挂在每次 push 上 —— 一次完整构建要十几分钟，没必要为每个提交付这个成本。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: android-actions/setup-android@v3

      # Tauri 需要 NDK 才能编 Rust 的 android 目标
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install frontend deps and build
        run: |
          npm ci
          npm run build

      # 先跑测试，别把红着的构建签出来发出去
      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Android app
        run: cargo tauri android build --target aarch64

      # 签名密钥不在仓库里，以 base64 存在 secret 中。
      # 三个 secret：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD
      # 生成 base64：base64 -w0 xchat-release.keystore
      #
      # 务必保管好这份密钥库：它一旦丢失或更换，已装的用户就无法覆盖安装，
      # 必须卸载重装并丢失本地数据。
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret ANDROID_KEYSTORE_BASE64，无法签名"
            exit 1
          fi
          ./sign-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: xchat-android-apk
          path: xchat-aarch64.apk
          if-no-files-found: error
